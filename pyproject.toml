[tool.poetry]
name = "single-pass-parsing-model-ranker"
version = "0.1.0"
description = "Rank LLMs by single-pass document parsing accuracy, latency, and price."
authors = ["Islander Eleven"]
readme = "README.md"
packages = [{ include = "single_pass_parsing_ranker", from = "src" }]

[tool.poetry.scripts]
single-pass-ranker = "single_pass_parsing_ranker.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
litellm = "^1.74.0"
pydantic = "^2.0"
jsonschema = "^4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
