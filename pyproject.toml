[tool.poetry]
name = "single-pass-parsing-model-ranker"
version = "0.1.0"
description = "Rank LLMs by single-pass document parsing accuracy, latency, and price."
authors = ["Islander Eleven"]
readme = "README.md"
packages = [{ include = "single_pass_parsing_ranker", from = "src" }]

[tool.poetry.scripts]
single-pass-ranker = "single_pass_parsing_ranker.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
litellm = "^1.74.0"
pydantic = "^2.0"
jsonschema = "^4.0"
pytesseract = "^0.3.13"
pillow = "^12.3.0"
pdfplumber = "^0.11.10"
pdf2image = "^1.17.0"
pypdf = "^6.20.1"
rapidfuzz = "^3.14.6"
universal-pathlib = "^0.3.10"
s3fs = "^2026.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.17.1"
mypy = "^2.4.0"
pytest-cov = "^7.1.0"
types-jsonschema = "^4.26.0.20261006"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["single_pass_parsing_ranker"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
