name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Verify project metadata and lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy

      - name: Run tests with coverage
        run: poetry run pytest -q --cov --cov-report=term-missing

      - name: Build package
        run: poetry build

      - name: Smoke-test CLI
        run: poetry run single-pass-ranker --help
